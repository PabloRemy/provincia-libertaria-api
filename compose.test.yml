services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: provincia_libertaria_test
      POSTGRES_USER: provincia_test
      POSTGRES_PASSWORD: provincia_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provincia_test -d provincia_libertaria_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./sql/test_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://provincia_test:provincia_test@postgres-test:5432/provincia_libertaria_test
      ADMIN_USERS: admin-test:clave-test:todos,armador-test:clave-test:tercera-seccion,berisso-test:clave-test:berisso,ensenada-test:clave-test:ensenada,laplata-test:clave-test:la-plata
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - uploads-test-data:/data/uploads

  seed-test:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: provincia_test
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - psql
      - --host=postgres-test
      - --username=provincia_test
      - --dbname=provincia_libertaria_test
      - --file=/seed/test_seed.sql
      - --set=ON_ERROR_STOP=1
    volumes:
      - ./sql:/seed:ro

  mysql-wordpress-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress_test
      MYSQL_PASSWORD: wordpress_test
      MYSQL_ROOT_PASSWORD: root_test_only
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-wordpress-test-data:/var/lib/mysql

  wordpress-test:
    image: wordpress:6.9.4-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: mysql-wordpress-test:3306
      WORDPRESS_DB_NAME: wordpress_test
      WORDPRESS_DB_USER: wordpress_test
      WORDPRESS_DB_PASSWORD: wordpress_test
      WORDPRESS_DEBUG: "1"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql-wordpress-test:
        condition: service_healthy
      api-test:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - wordpress-test-data:/var/www/html
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  postgres-test-data:
  uploads-test-data:
  mysql-wordpress-test-data:
  wordpress-test-data:
